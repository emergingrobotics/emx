[package]
name = "emx"
version.workspace = true
edition.workspace = true
description = "A fast terminal editor with Emacs keybindings, built for working alongside coding agents"
license.workspace = true
repository.workspace = true
readme = "VISION.md"
keywords = ["editor", "emacs", "terminal", "tui"]
categories = ["text-editors", "command-line-utilities"]

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emergingrobotics/emx"

# A panicking thread would leave the daemon alive but wedged (a buffer
# saving forever, a client never detached); aborting turns it into a crash
# the edit journal recovers from. The test harness still unwinds.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace.dependencies]
# Internal crates carry a version as well as a path so the published emx
# resolves them from crates.io. Keep the version in step with
# workspace.package.version.
emx-core = { path = "crates/emx-core", version = "0.0.5" }
emx-proto = { path = "crates/emx-proto", version = "0.0.5" }
emx-term = { path = "crates/emx-term", version = "0.0.5" }
emx-text = { path = "crates/emx-text", version = "0.0.5" }
emx-types = { path = "crates/emx-types", version = "0.0.5" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memchr = "2"
rustix = { version = "1", features = ["fs"] }
lru = "0.16"
proptest = "1"
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"
toml = "0.8"
slotmap = "1"
xattr = "1"
crc32fast = "1"
similar = "2"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "perf", "unicode", "meta", "nfa", "dfa", "hybrid"] }
regex-syntax = "0.8"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { workspace = true }
emx-core = { workspace = true }
emx-proto = { workspace = true }
emx-term = { workspace = true }
emx-text = { workspace = true }
emx-types = { workspace = true }
notify = { version = "8", default-features = false }
rustix = { workspace = true, features = ["fs", "net", "process", "stdio"] }
serde_json = { workspace = true }
signal-hook = "0.3"
thiserror = { workspace = true }

[dev-dependencies]
portable-pty = "0.9"
tempfile = { workspace = true }
vt100 = "0.15"

# notify's macOS backend (FSEvents); Linux uses inotify with no feature.
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# The peer's uid on a Unix socket (getpeereid; SO_PEERCRED is Linux's).
nix = { version = "0.30", default-features = false, features = ["socket", "user"] }

# musl's default allocator is too slow for this workload (DESIGN 8); the
# static builds swap in mimalloc. Only the musl target compiles it.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
