[package]
name = "emx"
version = "0.0.1"
edition = "2024"
description = "A fast terminal editor with Emacs keybindings, built for working alongside coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emergingrobotics/emx"
readme = "VISION.md"
keywords = ["editor", "emacs", "terminal", "tui"]
categories = ["text-editors", "command-line-utilities"]

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emergingrobotics/emx"

# A panicking thread would leave the daemon alive but wedged (a buffer
# saving forever, a client never detached); aborting turns it into a crash
# the edit journal recovers from. The test harness still unwinds.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memchr = "2"
rustix = { version = "1", features = ["fs"] }
lru = "0.16"
proptest = "1"
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"
toml = "0.8"
slotmap = "1"
xattr = "1"
crc32fast = "1"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { workspace = true }
emx-core = { path = "crates/emx-core" }
emx-proto = { path = "crates/emx-proto" }
emx-text = { path = "crates/emx-text" }
emx-types = { path = "crates/emx-types" }
rustix = { workspace = true, features = ["fs", "net", "process", "stdio"] }
signal-hook = "0.3"
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
