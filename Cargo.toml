[package]
name = "emx"
version = "0.0.1"
edition = "2024"
description = "A fast terminal editor with Emacs keybindings, built for working alongside coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emergingrobotics/emx"
readme = "VISION.md"
keywords = ["editor", "emacs", "terminal", "tui"]
categories = ["text-editors", "command-line-utilities"]

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emergingrobotics/emx"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memchr = "2"
rustix = { version = "1", features = ["fs"] }
lru = "0.16"
proptest = "1"
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"

[dependencies]
clap = { workspace = true }
